name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after packaging
        required: false
        default: false
        type: boolean
      tag:
        description: Existing v-prefixed tag used when publish is enabled
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            formats: nsis
          - os: ubuntu-24.04
            artifact: linux-x86_64
            formats: appimage,deb
          - os: macos-14
            artifact: macos-aarch64
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GPUI and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            elfutils \
            libasound2-dev \
            libfontconfig-dev \
            libfuse2t64 \
            libgit2-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            musl-dev \
            musl-tools \
            patchelf \
            pipewire \
            xdg-desktop-portal
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build signed packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats "${{ matrix.formats }}" --out-dir "dist/${{ matrix.artifact }}"
      - name: Build Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -OutputDirectory "dist/${{ matrix.artifact }}" -SkipBuild
      - name: Upload package outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/${{ matrix.artifact }}/*.exe
            dist/${{ matrix.artifact }}/*.zip
            dist/${{ matrix.artifact }}/*.AppImage
            dist/${{ matrix.artifact }}/*.deb
            dist/${{ matrix.artifact }}/*.dmg
            dist/${{ matrix.artifact }}/*.app.tar.gz
            dist/${{ matrix.artifact }}/*.sig
            dist/${{ matrix.artifact }}/*.sha256

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != '')
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output release-notes.md
      - name: Build signed update manifest and checksums
        shell: pwsh
        run: ./scripts/write-release-manifest.ps1 -Version "$env:RELEASE_TAG" -ArtifactsDirectory dist -OutputPath dist/latest.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.sig
            dist/**/*.sha256
            dist/latest.json
            dist/SHA256SUMS
