name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Compile release executable
        run: cargo build --locked --release
      - name: Build release assets
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}".TrimStart('v')
          .\scripts\package-portable.ps1 -Version $version -SkipBuild
          .\scripts\package-installer.ps1 -Version $version -SkipBuild
          .\scripts\write-release-manifest.ps1 -Version $version -Repository "${{ github.repository }}"
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
            dist/latest.json
