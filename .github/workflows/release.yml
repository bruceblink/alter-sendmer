name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after packaging
        required: false
        default: false
        type: boolean
      tag:
        description: Existing v-prefixed tag used when publish is enabled
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            formats: nsis
          - os: ubuntu-24.04
            artifact: linux-x86_64
            formats: appimage,deb
          - os: macos-14
            artifact: macos-aarch64
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux GPUI and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            elfutils \
            libasound2-dev \
            libfontconfig-dev \
            libfuse2t64 \
            libgit2-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            musl-dev \
            musl-tools \
            patchelf \
            pipewire \
            xdg-desktop-portal
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build signed packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats "${{ matrix.formats }}" --out-dir "dist/${{ matrix.artifact }}"
      - name: Build Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -OutputDirectory "dist/${{ matrix.artifact }}" -SkipBuild
      - name: Upload package outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/${{ matrix.artifact }}/*.exe
            dist/${{ matrix.artifact }}/*.zip
            dist/${{ matrix.artifact }}/*.AppImage
            dist/${{ matrix.artifact }}/*.deb
            dist/${{ matrix.artifact }}/*.dmg
            dist/${{ matrix.artifact }}/*.app.tar.gz
            dist/${{ matrix.artifact }}/*.sig
            dist/${{ matrix.artifact }}/*.sha256

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
      - name: Collect release subjects
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          SUBJECTS_DIR="$RUNNER_TEMP/alter-sendmer-subjects"
          rm -rf "$SUBJECTS_DIR"
          mkdir -p "$SUBJECTS_DIR"
          find dist -type f \( \
            -name '*.exe' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' \
          \) -print0 | while IFS= read -r -d '' asset; do
            cp "$asset" "$SUBJECTS_DIR/$(basename "$asset")"
          done
          mapfile -t subjects < <(find "$SUBJECTS_DIR" -type f -print | sort)
          if [ "${#subjects[@]}" -eq 0 ]; then
            echo "No release subjects were downloaded for ${RELEASE_TAG}."
            exit 1
          fi
          printf 'Collected %s release subjects for %s\n' "${#subjects[@]}" "$RELEASE_TAG"
          printf '%s\n' "${subjects[@]}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/alter-sendmer-subjects
          format: spdx-json
          output-file: dist/AlterSendmer-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign and verify release subjects and SBOM
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          IDENTITY_REGEX="^https://github[.]com/${GITHUB_REPOSITORY}/[.]github/workflows/release[.]yml@${WORKFLOW_REF}$"
          SBOM="dist/AlterSendmer-${RELEASE_TAG}.spdx.json"
          test -s "$SBOM"
          cosign sign-blob "$SBOM" --bundle "${SBOM}.sigstore.json" --yes
          cosign verify-blob "$SBOM" \
            --bundle "${SBOM}.sigstore.json" \
            --certificate-identity-regexp "$IDENTITY_REGEX" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          while IFS= read -r -d '' subject; do
            bundle="${subject}.sigstore.json"
            cosign sign-blob "$subject" --bundle "$bundle" --yes
            cosign verify-blob "$subject" \
              --bundle "$bundle" \
              --certificate-identity-regexp "$IDENTITY_REGEX" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            cp "$bundle" "dist/$(basename "$bundle")"
            test -s "dist/$(basename "$bundle")"
          done < <(find "$RUNNER_TEMP/alter-sendmer-subjects" -type f -print0 | sort -z)
      - name: Generate and verify release provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/alter-sendmer-subjects/*
      - name: Store provenance bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          PROVENANCE_ASSET="dist/AlterSendmer-${RELEASE_TAG}.attestation.json"
          cp "$PROVENANCE_BUNDLE" "$PROVENANCE_ASSET"
          test -s "$PROVENANCE_ASSET"
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$PROVENANCE_ASSET" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$WORKFLOW_REF"
          done < <(find "$RUNNER_TEMP/alter-sendmer-subjects" -type f -print0 | sort -z)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output release-notes.md
      - name: Build signed update manifest and checksums
        shell: pwsh
        run: ./scripts/write-release-manifest.ps1 -Version "$env:RELEASE_TAG" -ArtifactsDirectory dist -OutputPath dist/latest.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.sig
            dist/**/*.sha256
            dist/**/*.spdx.json
            dist/**/*.sigstore.json
            dist/**/*.attestation.json
            dist/latest.json
            dist/SHA256SUMS
