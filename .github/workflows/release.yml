name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Resolve declared targets
        id: plan
        run: python scripts/desktop-packaging.py plan

  package:
    needs: plan
    name: Package (${{ matrix.target }})
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.rust_target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Linux GPUI and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            elfutils \
            libasound2-dev \
            libfontconfig-dev \
            libfuse2t64 \
            libgit2-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            musl-dev \
            musl-tools \
            patchelf \
            pipewire \
            xdg-desktop-portal
      - name: Install macOS archive verifier
        if: runner.os == 'macOS'
        shell: bash
        run: command -v 7zz || brew install sevenzip
      - name: Install native Rust stable
        run: rustup toolchain install stable-${{ matrix.rust_target }} --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build and verify target packages
        env:
          TARGET_ID: ${{ matrix.target }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          STAGED_PACKAGES: ${{ runner.temp }}/desktop-package-output
        # 保留项目本身的依赖安装、打包和验收入口。
        run: python scripts/desktop-packaging.py package --target "${{ env.TARGET_ID }}" --output "${{ env.STAGED_PACKAGES }}"
      - name: Upload target packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-package-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-package-output/*
          if-no-files-found: error
          overwrite: true

  bundle:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    name: Verify release assets
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-package-*
          path: ${{ runner.temp }}/desktop-package-input
          merge-multiple: false
      - name: Collect and verify packages
        shell: bash
        run: |
          # 验证全部目标、便携包摘要以及客户端实际使用的更新签名。
          set -euo pipefail
          python scripts/desktop-packaging.py collect --input "$RUNNER_TEMP/desktop-package-input" --output dist
          sudo apt-get update
          sudo apt-get install -y minisign
          python scripts/ci-packages.py minisign dist
      - name: Collect release subjects
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          SUBJECTS_DIR="$RUNNER_TEMP/alter-sendmer-subjects"
          rm -rf "$SUBJECTS_DIR"
          mkdir -p "$SUBJECTS_DIR"
          find dist -type f \( \
            -name '*.exe' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' \
          \) -print0 | while IFS= read -r -d '' asset; do
            cp "$asset" "$SUBJECTS_DIR/$(basename "$asset")"
          done
          mapfile -t subjects < <(find "$SUBJECTS_DIR" -type f -print | sort)
          if [ "${#subjects[@]}" -eq 0 ]; then
            echo "No release subjects were downloaded for ${RELEASE_TAG}."
            exit 1
          fi
          printf 'Collected %s release subjects for %s\n' "${#subjects[@]}" "$RELEASE_TAG"
          printf '%s\n' "${subjects[@]}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ${{ runner.temp }}/alter-sendmer-subjects
          format: spdx-json
          output-file: dist/AlterSendmer-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Sign and verify release subjects and SBOM
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          IDENTITY_REGEX="^https://github[.]com/${GITHUB_REPOSITORY}/[.]github/workflows/release[.]yml@${WORKFLOW_REF}$"
          SBOM="dist/AlterSendmer-${RELEASE_TAG}.spdx.json"
          test -s "$SBOM"
          cosign sign-blob "$SBOM" --bundle "${SBOM}.sigstore.json" --yes
          cosign verify-blob "$SBOM" \
            --bundle "${SBOM}.sigstore.json" \
            --certificate-identity-regexp "$IDENTITY_REGEX" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          while IFS= read -r -d '' subject; do
            bundle="${subject}.sigstore.json"
            cosign sign-blob "$subject" --bundle "$bundle" --yes
            cosign verify-blob "$subject" \
              --bundle "$bundle" \
              --certificate-identity-regexp "$IDENTITY_REGEX" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            cp "$bundle" "dist/$(basename "$bundle")"
            test -s "dist/$(basename "$bundle")"
          done < <(find "$RUNNER_TEMP/alter-sendmer-subjects" -type f -print0 | sort -z)
      - name: Generate and verify release provenance
        id: provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/alter-sendmer-subjects/*
      - name: Store provenance bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          PROVENANCE_ASSET="dist/AlterSendmer-${RELEASE_TAG}.attestation.json"
          cp "$PROVENANCE_BUNDLE" "$PROVENANCE_ASSET"
          test -s "$PROVENANCE_ASSET"
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$PROVENANCE_ASSET" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$WORKFLOW_REF"
          done < <(find "$RUNNER_TEMP/alter-sendmer-subjects" -type f -print0 | sort -z)
      - name: Build signed update manifest and checksums
        shell: pwsh
        run: ./scripts/write-release-manifest.ps1 -Version "$env:RELEASE_TAG" -ArtifactsDirectory dist -OutputPath dist/latest.json
      - name: Check final hashes and upload verified assets
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-bundle
          path: dist/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release
    needs: [plan, bundle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release-bundle
          path: dist
      - name: Verify downloaded release bundle
        run: |
          cd dist
          sha256sum --check SHA256SUMS
      - name: Generate release notes
        run: python3 .github/scripts/generate_release_notes.py --tag "$RELEASE_TAG" --output release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
