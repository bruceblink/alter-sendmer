[package]
name = "alter-sendme-gpui"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Native GPUI client for AlterSendmer peer-to-peer file transfer"
repository = "https://github.com/bruceblink/alter-sendmer"
license = "AGPL-3.0"
readme = "README.md"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "819fe337999551ce8177b14c8db1127645617ae4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "819fe337999551ce8177b14c8db1127645617ae4", features = ["font-kit"] }
sendmer = "0.7.0"
iroh-blobs = "0.103"
tokio = { version = "1", features = ["full"] }
async-channel = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
walkdir = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cargo-packager-updater = "0.2.3"

[build-dependencies]
serde_json = "1"
embed-resource = "3.0.11"

[dev-dependencies]
iroh = "1.0.3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.packager]
product-name = "AlterSendmer"
identifier = "top.likanug.alter-sendme"
publisher = "BruceBlink"
homepage = "https://github.com/bruceblink/alter-sendmer"
category = "Utility"
icons = ["assets/alter-sendme@2x.png", "assets/alter-sendme.ico"]
license-file = "LICENSE"
resources = ["README.md", "PRIVACY.md"]
before-packaging-command = "cargo build --locked --release"

[[package.metadata.packager.binaries]]
path = "alter-sendme-gpui"
main = true

[package.metadata.packager.macos]
minimum-system-version = "12.0"
