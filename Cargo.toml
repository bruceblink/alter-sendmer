[package]
name = "alter-sendmer"
version = "0.7.3"
edition = "2024"
rust-version = "1.100"
description = "Native GPUI client for AlterSendmer peer-to-peer file transfer"
repository = "https://github.com/bruceblink/alter-sendmer"
license = "AGPL-3.0"
readme = "README.md"

[dependencies]
# 通过 Kit 加载原生后端，沿用应用自己的控件和资源。
gpui-kit = { version = "0.10.0", default-features = false }
sendmer = { version = "0.11.0", default-features = false }
iroh-blobs = "0.105"
tokio = { version = "1.54.1", features = ["full"] }
async-channel = "2.5.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
directories = "6.0.0"
walkdir = "2.5.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cargo-packager-updater = "0.2.3"

[build-dependencies]
serde_json = "1.0.154"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
iroh = "1.5.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.packager]
product-name = "AlterSendmer"
identifier = "top.likanug.alter-sendme"
publisher = "BruceBlink"
homepage = "https://github.com/bruceblink/alter-sendmer"
category = "Utility"
# macOS 打包优先使用原生 ICNS。PNG 和 ICO 分别用于 Linux 和 Windows。
icons = ["assets/alter-sendmer-macos.icns", "assets/alter-sendme@2x.png", "assets/alter-sendme.ico"]
license-file = "LICENSE"
resources = ["README.md", "PRIVACY.md"]
before-packaging-command = "cargo build --locked --release"

[[package.metadata.packager.binaries]]
path = "alter-sendmer"
main = true

[package.metadata.packager.macos]
minimum-system-version = "12.0"
# 在生成 DMG 和更新归档前签名整个应用，覆盖 Info.plist 和资源文件。
signing-identity = "-"
