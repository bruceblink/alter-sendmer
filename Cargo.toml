[package]
name = "alter-sendme-gpui"
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
description = "Native GPUI client for AlterSendmer peer-to-peer file transfer"
repository = "https://github.com/bruceblink/alter-sendmer"
license = "AGPL-3.0"
readme = "README.md"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.28.1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.28.1", features = ["font-kit", "wayland", "x11"] }
sendmer = { version = "0.11.0", default-features = false }
iroh-blobs = "0.105"
tokio = { version = "1.54.1", features = ["full"] }
async-channel = "2.5.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6.0.0"
walkdir = "2.5.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cargo-packager-updater = "0.2.3"

[build-dependencies]
serde_json = "1.0.154"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
iroh = "1.4.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.packager]
product-name = "AlterSendmer"
identifier = "top.likanug.alter-sendme"
publisher = "BruceBlink"
homepage = "https://github.com/bruceblink/alter-sendmer"
category = "Utility"
icons = ["assets/alter-sendme@2x.png", "assets/alter-sendme.ico"]
license-file = "LICENSE"
resources = ["README.md", "PRIVACY.md"]
before-packaging-command = "cargo build --locked --release"

[[package.metadata.packager.binaries]]
path = "alter-sendme-gpui"
main = true

[package.metadata.packager.macos]
minimum-system-version = "12.0"
