[package]
name = "alter-sendme-gpui"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Native GPUI client for AlterSendme peer-to-peer file transfer"
repository = "https://github.com/bruceblink/alter-sendme"
license = "AGPL-3.0"
readme = "README.md"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "819fe337999551ce8177b14c8db1127645617ae4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "819fe337999551ce8177b14c8db1127645617ae4", features = ["font-kit"] }
sendmer = { path = "../sendmer" }
tokio = { version = "1", features = ["full"] }
async-channel = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
walkdir = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
